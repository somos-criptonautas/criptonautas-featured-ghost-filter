name: Build

on:
  push:
    branches: [main]
  pull_request:

env:
  IMAGE: ghcr.io/somos-criptonautas/criptonautas-featured-ghost-filter

jobs:
  test-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements.txt
      - name: Unit tests
        run: python -m unittest discover tests

      - name: Build image
        run: docker build --label org.opencontainers.image.source=https://github.com/${{ github.repository }} -t $IMAGE:latest -t $IMAGE:${{ github.sha }} .
      - name: Run image with production limits
        run: docker run -d --name filter -p 127.0.0.1:8000:8000 --read-only --tmpfs /tmp --memory 1g --pids-limit 64 --cap-drop ALL $IMAGE:latest
      - name: Wait until healthy
        run: |
          for i in $(seq 30); do
            [ "$(docker inspect -f '{{.State.Health.Status}}' filter)" = healthy ] && exit 0
            sleep 2
          done
          exit 1
      - name: Service check
        run: python tests/service_check.py
      - if: failure()
        run: docker logs filter

      - name: Publish to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          docker push --all-tags $IMAGE
